<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product | HerLuxe</title>
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="product.css" />
  </head>
  <body>
    <div class="page">
      <!-- ================= HEADER ================= -->
      <div data-site-header></div>

      <!-- ================= BREADCRUMB ================= -->
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="home.html">Home</a>
        <span>/</span>
        <span id="breadcrumb-current">Product</span>
      </nav>

      <!-- ================= PRODUCT DETAIL (filled by JS) ================= -->
      <main id="product-detail-root" class="product-detail-section">
        <!-- Nội dung sẽ được render bằng JavaScript bên dưới -->
      </main>

      <!-- ================= FOOTER ================= -->
      <footer class="footer">
        <!-- FOOTER LOGO -->
        <div class="footer-logo">
          <a href="#">
            <img src="./images/logo1.png" alt="HerLuxe Logo" />
          </a>
        </div>
        <div class="footer-line"></div>
        <!-- FOOTER CONTENT -->
        <div class="footer-content">
          <!-- COLUMN 1 -->
          <div class="footer-column">
            <a href="about.html"> ABOUT US </a>
            <a href="faq.html"> FAQ </a>
            <a href="contact.html"> CONTACT </a>
          </div>
          <!-- COLUMN 2 -->
          <div class="footer-column">
            <h3>CUSTOMER SERVICE</h3>
            <p>support@herluxe.com</p>
            <p>012-345-6789</p>
          </div>
          <!-- COLUMN 3 -->
          <div class="footer-column address">
            <p>
              123 Nguyen Trai Street,<br />
              District 1, Ho Chi Minh City,<br />
              Vietnam
            </p>
            <div class="footer-social">
              <a href="#">
                <i class="fa-brands fa-facebook-f"></i>
              </a>
              <a href="#">
                <i class="fa-brands fa-instagram"></i>
              </a>
              <a href="#">
                <i class="fa-brands fa-youtube"></i>
              </a>
            </div>
          </div>
        </div>
        <!-- COPYRIGHT -->
        <div class="copyright">2026 HerLuxe. All Rights reserved</div>
      </footer>
    </div>

    <!-- ================= DATA ================= -->
    <script src="products.js"></script>

    <!-- ================= RENDER LOGIC ================= -->
    <script>
      function formatPrice(price) {
        return "$" + price.toFixed(2);
      }

      function renderNotFound(root) {
        root.innerHTML = `
          <div class="product-not-found">
            <h1>Không tìm thấy sản phẩm</h1>
            <p>Sản phẩm bạn đang tìm có thể đã bị xóa hoặc đường dẫn không đúng.</p>
            <a href="home.html" class="back-to-shop">Quay lại trang chủ</a>
          </div>
        `;
      }

      function renderProduct(root, product) {
        document.title = product.name + " | HerLuxe";
        document.getElementById("breadcrumb-current").textContent =
          product.name;

        root.innerHTML = `
          <div class="product-detail-container">
            <div class="product-detail-image">
              <img src="${product.image}" alt="${product.name}" />
            </div>
            <div class="product-detail-info">
              <p class="product-category">${product.category}</p>
              <h1>${product.name}</h1>
              <p class="product-detail-price">${formatPrice(product.price)}</p>
              <p class="product-short-description">${product.shortDescription}</p>
              <p class="product-description">${product.description}</p>

              <div class="product-purchase-row">
                <div class="quantity-box">
                  <button type="button" id="qty-minus" aria-label="Giảm số lượng">−</button>
                  <input type="text" id="qty-input" value="1" inputmode="numeric" />
                  <button type="button" id="qty-plus" aria-label="Tăng số lượng">+</button>
                </div>
                <button type="button" class="add-to-cart-btn" id="add-to-cart-btn">
                  Add to bag
                </button>
              </div>
              <p class="add-to-cart-note" id="add-to-cart-note"></p>

              <a href="home.html#makeup" class="back-to-shop">← Tiếp tục xem sản phẩm khác</a>
            </div>
          </div>
        `;

        const qtyInput = document.getElementById("qty-input");
        document.getElementById("qty-minus").addEventListener("click", () => {
          const current = Math.max(1, parseInt(qtyInput.value, 10) || 1);
          qtyInput.value = Math.max(1, current - 1);
        });
        document.getElementById("qty-plus").addEventListener("click", () => {
          const current = Math.max(1, parseInt(qtyInput.value, 10) || 1);
          qtyInput.value = current + 1;
        });

        document
          .getElementById("add-to-cart-btn")
          .addEventListener("click", () => {
            const qty = Math.max(1, parseInt(qtyInput.value, 10) || 1);
            // addToCart() sẽ được định nghĩa trong cart.js ở bước tiếp theo.
            if (typeof addToCart === "function") {
              addToCart(product.id, qty);
              document.getElementById("add-to-cart-note").textContent =
                "Đã thêm vào giỏ hàng!";
            } else {
              document.getElementById("add-to-cart-note").textContent =
                "(Chức năng giỏ hàng sẽ được kết nối ở bước tiếp theo)";
            }
          });
      }

      document.addEventListener("DOMContentLoaded", () => {
        const root = document.getElementById("product-detail-root");
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const product = id ? getProductById(id) : null;

        if (!product) {
          renderNotFound(root);
          return;
        }
        renderProduct(root, product);
      });
    </script>
    <script src="header.js"></script>
  </body>
</html>
