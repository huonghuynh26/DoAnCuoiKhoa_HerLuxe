<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | HerLuxe</title>
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="register.css" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="page">
      <!-- ================= HEADER ================= -->
      <div data-site-header></div>
      <!-- ================= REGISTER SECTION ================= -->
      <main class="register-section">
        <!-- LEFT: REGISTER FORM -->
        <div class="register-form">
          <h1>Register</h1>
          <!-- NAME -->
          <div class="form-group">
            <label for="name"> Name </label>
            <input type="text" id="name" placeholder="Full Name" />
          </div>
          <!-- EMAIL -->
          <div class="form-group">
            <label for="email"> Email </label>
            <input type="email" id="email" placeholder="name@mail.com" />
          </div>
          <!-- PHONE -->
          <div class="form-group">
            <label for="phone"> Phone Number </label>
            <input type="tel" id="phone" placeholder="000-000-000" />
          </div>
          <!-- PASSWORD -->
          <div class="form-group password-group">
            <label for="password"> Password </label>
            <div class="password-box">
              <input type="password" id="password" placeholder="password" />
              <button type="button" id="showPassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <!-- REGISTER BUTTON -->
          <button class="register-button">Create My Account</button>
          <!-- LOGIN -->
          <p class="login-text">
            Already have an account?
            <a href="login.html"> Login here </a>
          </p>
        </div>
        <!-- RIGHT: REGISTER CARD -->
        <div class="register-card">
          <div class="card-border">
            <!-- LOGO -->
            <div class="logo-register-card">
              <img src="./images/logo3.png" alt="HerLuxe Logo" />
            </div>
            <h2>Welcome</h2>
            <p>Discover your beauty</p>
            <!-- SOCIAL -->
            <div class="social-icons">
              <a href="#">
                <i class="fa-brands fa-facebook-f"></i>
              </a>
              <a href="#">
                <i class="fa-brands fa-instagram"></i>
              </a>
              <a href="#">
                <i class="fa-brands fa-youtube"></i>
              </a>
            </div>
          </div>
        </div>
      </main>
      <!-- ================= FOOTER ================= -->
      <footer class="footer">
        <!-- FOOTER LOGO -->
        <div class="footer-logo">
          <a href="#">
            <img src="./images/logo1.png" alt="HerLuxe Logo" />
          </a>
        </div>
        <div class="footer-line"></div>
        <!-- FOOTER CONTENT -->
        <div class="footer-content">
          <!-- COLUMN 1 -->
          <div class="footer-column">
            <a href="about.html"> ABOUT US </a>
            <a href="faq.html"> FAQ </a>
            <a href="contact.html"> CONTACT </a>
          </div>
          <!-- COLUMN 2 -->
          <div class="footer-column">
            <h3>CUSTOMER SERVICE</h3>
            <p>support@herluxe.com</p>
            <p>012-345-6789</p>
          </div>
          <!-- COLUMN 3 -->
          <div class="footer-column address">
            <p>
              123 Nguyen Trai Street,<br />
              District 1, Ho Chi Minh City,<br />
              Vietnam
            </p>
            <div class="footer-social">
              <a href="#">
                <i class="fa-brands fa-facebook-f"></i>
              </a>
              <a href="#">
                <i class="fa-brands fa-instagram"></i>
              </a>
              <a href="#">
                <i class="fa-brands fa-youtube"></i>
              </a>
            </div>
          </div>
        </div>
        <!-- COPYRIGHT -->
        <div class="copyright">2026 HerLuxe. All Rights reserved</div>
      </footer>
    </div>
    <!-- ================= PASSWORD SCRIPT ================= -->
    <script>
      const password = document.getElementById("password");
      const showPassword = document.getElementById("showPassword");
      showPassword.addEventListener("click", function () {
        if (password.type === "password") {
          password.type = "text";
          this.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
        } else {
          password.type = "password";
          this.innerHTML = '<i class="fa-solid fa-eye"></i>';
        }
      });
    </script>
    <script src="header.js"></script>
  </body>
</html>
